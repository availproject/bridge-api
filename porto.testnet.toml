# porto config for bridge/testnet/bridge-api
# Deploy source: v2.0.1-rc4 (= what hex runs against an infinity chain) —
# contains the infinity bridge_queryDataProof RPC fix, DATABASE_URL support,
# and the MPS /range URL fix.
# All env vars the binary reads are listed ACTIVE (coordinator convention):
# real values where decided, SET-BEFORE-DEPLOY where chain-dependent,
# SET-OR-DELETE-BEFORE-DEPLOY for optionals with code defaults (delete the
# line on deploy day to get default behavior; invalid values fail fast if
# forgotten). Secrets stay OUT of [env]: ETHEREUM_CLIENT_URL, BEACONCHAIN_URL,
# DATABASE_URL via secret:k8s (DATABASE_URL takes precedence over the PG_*
# fallback quartet, which we do not wire).

[network]
port = 8080

[resources]
cpu_request = "100m"
cpu_limit = "1"
memory_request = "256Mi"
memory_limit = "1Gi"

[env]
HOST = "0.0.0.0"
PORT = "8080"

# --- chain-dependent: fill on deploy day ---
AVAIL_CHAIN_NAME = "SET-BEFORE-DEPLOY"
AVAIL_CLIENT_URL = "SET-BEFORE-DEPLOY"
BRIDGE_CONTRACT_ADDRESS = "SET-BEFORE-DEPLOY"
VECTORX_CONTRACT_ADDRESS = "SET-BEFORE-DEPLOY"
CHAIN_11155111_CONTRACT_ADDRESS = "SET-BEFORE-DEPLOY"

# --- decided ---
CONTRACT_CHAIN_ID = "11155111"
CHAIN_11155111_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
MERKLE_PROOF_SERVICE_URL = "http://bridge-testnet-merkle-proof-service.default.svc.cluster.local:3000/api"
ETH_HEAD_CACHE_MAXAGE = "30"
AVL_HEAD_CACHE_MAXAGE = "60"
ETH_PROOF_FAILURE_CACHE_MAXAGE = "600"
HELIOS_UPDATE_FREQUENCY = "3600"
VECTOR_UPDATE_FREQUENCY = "360"

# --- optionals with code defaults ---
MAX_CONCURRENT_REQUEST = "SET-OR-DELETE-BEFORE-DEPLOY"
HEAD_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
PROOF_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
AVL_PROOF_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
ETH_PROOF_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
SLOT_MAPPING_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
TRANSACTIONS_CACHE_MAXAGE = "SET-OR-DELETE-BEFORE-DEPLOY"
